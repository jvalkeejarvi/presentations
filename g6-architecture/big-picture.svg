<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Browser -->
  <rect x="10" y="225" width="120" height="56" rx="28" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="70" y="258" text-anchor="middle">Selain</text>

  <!-- Entra -->
  <rect x="170" y="30" width="170" height="64" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="255" y="57" text-anchor="middle">Entra External ID</text>
  <text x="255" y="78" text-anchor="middle" font-size="13">kirjautuminen + JWT</text>

  <!-- Front Door -->
  <rect x="170" y="225" width="170" height="56" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="255" y="250" text-anchor="middle">Azure Front Door</text>
  <text x="255" y="270" text-anchor="middle" font-size="13">polkuun perustuva reititys</text>

  <!-- React -->
  <rect x="170" y="400" width="170" height="64" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="255" y="427" text-anchor="middle">React SPA</text>
  <text x="255" y="448" text-anchor="middle" font-size="13">staattiset tiedostot</text>

  <line x1="130" y1="253" x2="168" y2="253" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M70,225 L70,62 L168,62" fill="none" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <line x1="255" y1="281" x2="255" y2="398" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Container App Environment -->
  <rect x="390" y="20" width="330" height="480" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="555" y="44" text-anchor="middle" font-weight="bold">Container Apps: yksi API per palvelu</text>

  <g font-size="14" text-anchor="middle">
    <rect x="410" y="60" width="140" height="36" rx="6" fill="#fff" stroke="#475569"/><text x="480" y="83">recipes</text>
    <rect x="565" y="60" width="140" height="36" rx="6" fill="#fff" stroke="#475569"/><text x="635" y="83">panorama</text>
    <rect x="410" y="106" width="140" height="36" rx="6" fill="#fff" stroke="#475569"/><text x="480" y="129">ingredients</text>
    <rect x="565" y="106" width="140" height="36" rx="6" fill="#fff" stroke="#475569"/><text x="635" y="129">purchaseproducts</text>
    <rect x="410" y="152" width="140" height="36" rx="6" fill="#fff" stroke="#475569"/><text x="480" y="175">procurement</text>
    <rect x="565" y="152" width="140" height="36" rx="6" fill="#fff" stroke="#475569"/><text x="635" y="175">settings</text>
    <rect x="410" y="198" width="140" height="36" rx="6" fill="#fff" stroke="#475569"/><text x="480" y="221">basicdata</text>
    <rect x="565" y="198" width="140" height="36" rx="6" fill="#fff" stroke="#475569"/><text x="635" y="221">tags</text>
    <rect x="410" y="244" width="140" height="36" rx="6" fill="#fff" stroke="#475569"/><text x="480" y="267">mediabank</text>
    <rect x="565" y="244" width="140" height="36" rx="6" fill="#fff" stroke="#475569"/><text x="635" y="267">emenu</text>
    <rect x="410" y="290" width="140" height="36" rx="6" fill="#fff" stroke="#475569"/><text x="480" y="313">pricecatalogs</text>
    <rect x="565" y="290" width="140" height="36" rx="6" fill="#fff" stroke="#475569"/><text x="635" y="313">integration</text>
    <text x="555" y="356" font-size="13" fill="#475569">... ja muutama muu</text>
  </g>

  <!-- Service Bus -->
  <rect x="410" y="420" width="295" height="60" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="557" y="446" text-anchor="middle">Azure Service Bus</text>
  <text x="557" y="466" text-anchor="middle" font-size="13">eventit palveluiden välillä</text>
  <line x1="557" y1="370" x2="557" y2="418" stroke="#be185d" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <line x1="340" y1="253" x2="388" y2="253" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="364" y="300" text-anchor="middle" font-size="12" transform="rotate(-90 364 300)">HTTPS + JWT</text>

  <!-- Azure SQL -->
  <rect x="760" y="20" width="190" height="480" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="855" y="44" text-anchor="middle" font-weight="bold">Azure SQL</text>
  <g font-size="13" text-anchor="middle">
    <ellipse cx="855" cy="80" rx="70" ry="18" fill="#dcfce7" stroke="#15803d"/><text x="855" y="85">recipes-db</text>
    <ellipse cx="855" cy="126" rx="70" ry="18" fill="#dcfce7" stroke="#15803d"/><text x="855" y="131">panorama-db</text>
    <ellipse cx="855" cy="172" rx="70" ry="18" fill="#dcfce7" stroke="#15803d"/><text x="855" y="177">foodstuffdb</text>
    <ellipse cx="855" cy="218" rx="70" ry="18" fill="#dcfce7" stroke="#15803d"/><text x="855" y="223">settings-db</text>
    <ellipse cx="855" cy="264" rx="70" ry="18" fill="#dcfce7" stroke="#15803d"/><text x="855" y="269">tags-db</text>
    <text x="855" y="310" fill="#15803d">...</text>
    <rect x="785" y="420" width="140" height="60" rx="8" fill="#dcfce7" stroke="#15803d"/>
    <text x="855" y="446">Blob Storage</text>
    <text x="855" y="466" font-size="12">mediabankin tiedostot</text>
  </g>
  <line x1="722" y1="180" x2="758" y2="180" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="740" y="400" text-anchor="middle" font-size="12" fill="#15803d" transform="rotate(-90 740 400)">oma tietokanta per palvelu</text>
</svg>
